// ============================================================================
// Marketplace Messages
// ============================================================================

message CreateProductRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
  string title = 3;
  google.protobuf.StringValue description_html = 4; // Optional
  google.protobuf.StringValue cover_image_url = 5; // Optional
  double price = 6;
  string currency = 7; // ISO 4217 code (USD, EUR, etc.)
}

message CreateProductResponse {
