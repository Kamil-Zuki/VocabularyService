// ============================================================================
// Lessons Module
// ============================================================================

message LessonDto {
  string id = 1;
  string title = 2;
  string description = 3;
  string category = 4;
  string difficulty = 5;
  string content_markdown = 6;
  google.protobuf.StringValue color_css_class = 7;
  google.protobuf.StringValue system_prompt = 8;
  string cefr_level = 9;
  int32 order_index = 10;
  google.protobuf.StringValue unlocks_after_lesson_id = 11;
  string target_skills = 12;
  int32 estimated_minutes = 13;
}

message UserLessonProgressDto {
  string id = 1;
  string user_id = 2;
  string lesson_id = 3;
  int32 status = 4;
  google.protobuf.StringValue agent_thread_id = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  int32 score_percent = 8;       // 0-100, set on completion
  int32 time_spent_seconds = 9;  // total time spent in lesson
}

message LessonWithProgressDto {
  LessonDto lesson = 1;
  UserLessonProgressDto progress = 2; // nullable
}

message GetLessonsRequest {
  string user_id = 1;
}

message GetLessonsResponse {
  repeated LessonWithProgressDto lessons = 1;
}

message GetLessonRequest {
  string lesson_id = 1;
  string user_id = 2;
}

message GetLessonResponse {
  LessonWithProgressDto lesson_with_progress = 1;
}

message StartLessonRequest {
  string lesson_id = 1;
  string user_id = 2;
  string agent_thread_id = 3;
}

message StartLessonResponse {
  UserLessonProgressDto progress = 1;
}

message CompleteLessonRequest {
  string lesson_id = 1;
  string user_id = 2;
  int32 score_percent = 3;       // 0-100 result score (optional, 0 = not graded)
  int32 time_spent_seconds = 4;  // session time in seconds (optional)
}

message SetPlacementLevelRequest {
  string user_id = 1;
  string cefr_level = 2; // e.g. A1, A2, B1, B2, C1, C2
}

// Phase 4: SubmitKnowledgeCheckResultRequest
message SubmitKnowledgeCheckResultRequest {
  string user_id = 1;
  string project_id = 2;
  repeated string term_ids = 3;
  int32 reading_score = 4;
  int32 listening_score = 5;
  int32 writing_score = 6;
  int32 speaking_score = 7;
}

// Phase 4: Autopilot
message GetDailyAutopilotPlanRequest {
  string user_id = 1;
  string project_id = 2;
}

message DailyAutopilotTask {
  string task_type = 1; // e.g. "reading", "fsrs", "knowledge_check"
  string title = 2;
  string description = 3;
  bool is_completed = 4;
  string action_url = 5;
  int32 duration_minutes = 6;
}

message GetDailyAutopilotPlanResponse {
  repeated DailyAutopilotTask tasks = 1;
}

message GetSkillAssessmentHistoryRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
  int32 limit = 3; // optional, default 20
}

message SkillAssessmentLogDto {
  string id = 1; // UUID
  string skill = 2; // reading, listening, writing, speaking
  int32 score = 3; // 0-100
  string created_at = 4; // ISO 8601
}

message GetSkillAssessmentHistoryResponse {
  repeated SkillAssessmentLogDto logs = 1;
}

// Phase 4: Skill Activity Tracking
message TrackSkillActivityRequest {
  string user_id      = 1; // UUID
  string project_id   = 2; // UUID
  int32  skill_type_id = 3; // FK → SkillTypes.Id (1=reading, 2=listening, 3=writing, 4=speaking)
  int32  value        = 4; // minutes or exercises count to add
}

message TrackSkillActivityResponse {
  int32 total_value_today = 1; // accumulated value for this skill today
  bool  is_completed      = 2; // whether CompletionThreshold has been reached
}
