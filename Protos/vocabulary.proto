  google.protobuf.StringValue forked_from_id = 2; // UUID
  string license_type = 3;
}

message GetPublishedDecksRequest {
  string user_id = 1; // UUID
  google.protobuf.StringValue author_id = 2; // UUID (Optional)
  google.protobuf.StringValue search_query = 3; // Optional
  int32 page = 4;
  int32 page_size = 5;
}

message GetPublishedDecksResponse {
  repeated PublishedDeckDto decks = 1;
