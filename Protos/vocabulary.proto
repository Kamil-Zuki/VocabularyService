}

message GetProductStatsRequest {
  string user_id = 1; // UUID
  string product_id = 2; // UUID
}

message GetProductStatsResponse {
  string product_id = 1; // UUID
  int32 sales_count = 2;
  int32 reviews_count = 3;
  double average_rating = 4;
