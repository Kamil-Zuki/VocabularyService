// ============================================================================
// Sync Service (SR-SNC-01, SR-SNC-03)
// ============================================================================

service SyncService {
  // --------------------------------------------------------------------------
  // Synchronization (SR-SNC-01, SR-SNC-03)
  // --------------------------------------------------------------------------

  // Получение дельты изменений (SR-SNC-01)
  rpc SyncData (SyncDataRequest) returns (SyncDataResponse);

  // Отправка офлайн-ответов (SR-SNC-03)
  rpc BatchSubmitReviews (BatchSubmitReviewsRequest) returns (BatchSubmitReviewsResponse);
}

// SR-SNC-01: Sync Data Messages
message SyncDataRequest {
  string user_id = 1; // UUID
  google.protobuf.Timestamp last_sync_token = 2; // Timestamp последней синхронизации
  google.protobuf.StringValue project_id = 3; // UUID (Optional, null = all projects)
}

message SyncChanges {
  repeated SyncDeck decks = 1; // Измененные колоды
  repeated SyncCard cards = 2; // Измененные карточки
  repeated UserCardProgressDto progress = 3; // Измененный прогресс
}

// Упрощенные типы для синхронизации
message SyncDeck {
  string id = 1; // UUID
  string project_id = 2; // UUID
  google.protobuf.StringValue parent_deck_id = 3; // UUID, nullable
  string owner_id = 4; // UUID
  string title = 5;
  google.protobuf.StringValue description = 6; // nullable
  google.protobuf.StringValue cover_image_url = 7; // nullable
  bool is_public = 8;
  ContributionPolicy contribution_policy = 9;
  LicenseType license_type = 10;
  google.protobuf.StringValue forked_from_id = 11; // UUID, nullable
  int32 card_count = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14; // Для синхронизации
}

message SyncCard {
  string id = 1; // UUID
  string deck_id = 2; // UUID
  string creator_id = 3; // UUID
  string note_id = 4; // UUID
  map<string, NoteFieldValuePayload> field_values = 5;
  string search_document = 6;
  google.protobuf.StringValue project_term_id = 7; // UUID
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message DeletedObjectInfo {
  string entity_id = 1; // UUID
  string entity_type = 2; // DECK, CARD, PROJECT
}

message SyncDataResponse {
  google.protobuf.Timestamp sync_token = 1; // Новый токен синхронизации
  bool requires_full_sync = 2; // Флаг принудительной полной перезагрузки
  SyncChanges changes = 3;
  repeated DeletedObjectInfo deleted_objects = 4; // Tombstones
  bool has_more = 5; // Есть ли еще данные для синхронизации
}

// UserCardProgressDto для синхронизации
message UserCardProgressDto {
  string card_id = 1; // UUID
  string project_id = 2; // UUID
  int32 state = 3; // 0=NEW, 1=LEARNING, 2=REVIEW, 3=MATURE
  float stability = 4;
  float difficulty = 5;
  google.protobuf.Timestamp due = 6;
  int32 elapsed_days = 7;
  int32 scheduled_days = 8;
  int32 reps = 9;
  int32 lapses = 10;
  bool is_suspended = 11;
  google.protobuf.Timestamp last_review = 12;
}

// SR-SNC-03: Batch Submit Reviews Messages
message BatchSubmitReviewsRequest {
  string user_id = 1; // UUID
  repeated BatchReviewItem reviews = 2;
}

message BatchReviewItem {
  string card_id = 1; // UUID
  int32 rating = 2; // 1-4 (Again, Hard, Good, Easy)
  google.protobuf.Timestamp reviewed_at = 3; // Время ответа (для офлайн-режима)
  int32 duration_ms = 4; // Длительность ответа в миллисекундах
  google.protobuf.StringValue session_id = 5; // UUID (Optional)
  google.protobuf.StringValue user_answer = 6; // Optional (для валидации)
}

message BatchSubmitReviewsResponse {
  int32 processed_count = 1; // Количество успешно обработанных ревью
  int32 failed_count = 2; // Количество неудачных ревью
  repeated string failed_card_ids = 3; // ID карточек, которые не удалось обработать
}

// ============================================================================
// 7. AIService (AI Tools) - SR-AI-01, SR-AI-02
// ============================================================================

service AIService {
  // --------------------------------------------------------------------------
  // AI Context Generation (SR-AI-01)
  // --------------------------------------------------------------------------

  // Генерация примеров предложений с заданным словом (SR-AI-01)
  rpc GenerateContext (GenerateContextRequest) returns (GenerateContextResponse);

  // --------------------------------------------------------------------------
  // Grammar Explanation (SR-AI-02)
  // --------------------------------------------------------------------------

  // Объяснение грамматики для конкретной фразы (SR-AI-02)
  rpc ExplainGrammar (ExplainGrammarRequest) returns (ExplainGrammarResponse);
}

// SR-AI-01: Generate Context Messages
message GenerateContextRequest {
  string user_id = 1; // UUID
  string target_word = 2; // Целевое слово для генерации примеров
  string language = 3; // Код языка (ISO 639-1), например "en"
  string user_level = 4; // Уровень пользователя (CEFR): A1, A2, B1, B2, C1, C2
  int32 count = 5; // Количество примеров (обычно 3-5)
}

message ContextSuggestion {
  string sentence = 1; // Предложение с целевым словом
  string translation = 2; // Перевод предложения
  string target_word = 3; // Целевое слово (может отличаться от исходного из-за склонений)
  TargetIndex target_index = 4; // Позиция целевого слова в предложении
}

message GenerateContextResponse {
  repeated ContextSuggestion suggestions = 1; // Массив предложений
}

// SR-AI-02: Explain Grammar Messages
message ExplainGrammarRequest {
  string user_id = 1; // UUID
  string sentence = 2; // Предложение для анализа
  string target_word = 3; // Целевое слово, для которого нужно объяснение
  string user_native_language = 4; // Родной язык пользователя (ISO 639-1), например "ru"
  google.protobuf.StringValue context_prompt = 5; // Опциональный дополнительный контекст
}

message ExplainGrammarResponse {
  string explanation = 1; // Текст объяснения грамматики
  google.protobuf.StringValue related_topic = 2; // Связанная тема (например, "Passé Composé")
}

// ============================================================================
// 8. TextService (Text Analysis) - SR-TXT-01
// ============================================================================

service TextService {
  // --------------------------------------------------------------------------
  // Text Tokenization & Analysis (SR-TXT-01)
  // --------------------------------------------------------------------------

  // Токенизация и анализ текста (SR-TXT-01)
  rpc AnalyzeText (AnalyzeTextRequest) returns (AnalyzeTextResponse);
}

// SR-TXT-01: Analyze Text Messages
message AnalyzeTextRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID проекта
  string text = 3; // Текст для анализа
}

enum TokenStatus {
  TOKEN_STATUS_NEW = 0; // Новое слово (не в словаре)
  TOKEN_STATUS_LEARNING = 1; // Слово в процессе изучения
  TOKEN_STATUS_KNOWN = 2; // Выученное слово
  TOKEN_STATUS_IGNORED = 3; // Игнорируемый термин
}

enum TokenType {
  TOKEN_TYPE_WORD = 0; // Слово
  TOKEN_TYPE_SPACE = 1; // Пробел
  TOKEN_TYPE_PUNCTUATION = 2; // Знак препинания
}

message TextToken {
  reserved 2;
  string text = 1; // Исходный текст токена
  TokenStatus status = 3; // Статус слова (NEW, LEARNING, KNOWN, IGNORED)
  TokenType type = 4; // Тип токена (WORD, SPACE, PUNCTUATION)
  google.protobuf.StringValue term_text = 5; // Нормализованная реальная форма
  google.protobuf.StringValue project_term_id = 6; // UUID ProjectTerm when tracked
}

message TextPhrase {
  int32 start_index = 1;
  int32 end_index = 2;
  string text = 3;
  TokenStatus status = 4;
  google.protobuf.StringValue project_term_id = 5;
}

message TextAnalysisStats {
  int32 unique_words = 1; // Количество уникальных слов
  double known_percentage = 2; // Процент знакомых слов (0.0 - 1.0)
  int32 new_words_count = 3; // Количество новых слов
  int32 learning_words_count = 4; // Количество слов в процессе изучения
  int32 known_words_count = 5; // Количество выученных слов
}

message AnalyzeTextResponse {
  repeated TextToken tokens = 1; // Массив токенов для рендеринга
  TextAnalysisStats stats = 2; // Статистика анализа
  repeated TextPhrase phrases = 3; // Сохранённые фразы (приоритет над отдельными словами)
}

// ============================================================================
// 9. AutonomyService (SR-AUTO-01..06)
// ============================================================================

service AutonomyService {
  rpc GetDailyAutopilot (GetDailyAutopilotRequest) returns (GetDailyAutopilotResponse);
  rpc GetNextBestActions (GetNextBestActionsRequest) returns (GetNextBestActionsResponse);
}

message GetDailyAutopilotRequest {
  string user_id = 1;
  string project_id = 2;
  google.protobuf.StringValue deck_id = 3;
}

message NextBestAction {
  string id = 1;
  string type = 2;
  string title = 3;
  string description = 4;
  int32 priority = 5;
  google.protobuf.StringValue deck_id = 6;
}

message GetDailyAutopilotResponse {
  string user_id = 1;
  string project_id = 2;
  google.protobuf.StringValue deck_id = 3;
  string plan_date = 4;
  int32 suggested_minutes = 5;
  int32 suggested_new_cards = 6;
  int32 suggested_reviews = 7;
  int32 backlog_risk_score = 8;
  string session_mode = 9;
  repeated NextBestAction next_best_actions = 10;
}

message GetNextBestActionsRequest {
  string user_id = 1;
  string project_id = 2;
  google.protobuf.StringValue deck_id = 3;
}

message GetNextBestActionsResponse {
  repeated NextBestAction actions = 1;
}

// ============================================================================
// 10. SubscriptionService (Deck Subscriptions)
// ============================================================================

service SubscriptionService {
  // Lists current user's deck subscriptions.
  rpc ListSubscriptions (ListSubscriptionsRequest) returns (ListSubscriptionsResponse);

  // Subscribes the current user to a deck.
  rpc Subscribe (SubscribeRequest) returns (SubscriptionItemResponse);

  // Unsubscribes the current user from a deck (idempotent).
  rpc Unsubscribe (UnsubscribeRequest) returns (google.protobuf.Empty);
}

message ListSubscriptionsRequest {
}

message ListSubscriptionsResponse {
  repeated SubscriptionItemResponse items = 1;
}

message SubscribeRequest {
  string deck_id = 1; // UUID
}

message UnsubscribeRequest {
  string deck_id = 1; // UUID
}

message SubscriptionItemResponse {
  string deck_id = 1; // UUID
  string project_id = 2; // UUID
  string title = 3;
  google.protobuf.Timestamp subscribed_at = 4;
  google.protobuf.Timestamp last_accessed_at = 5;
  int32 last_synced_version = 6;
}

