// ============================================================================
// Study Service Messages
// ============================================================================

message StartStudySessionRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
  google.protobuf.StringValue deck_id = 3; // UUID, optional
}

message StartStudySessionResponse {
  string session_id = 1; // UUID
  string project_id = 2; // UUID
  string status = 3; // ACTIVE, COMPLETED
  google.protobuf.Timestamp start_time = 4;
  int32 cards_reviewed = 5;
  QueueStats queue_stats = 6;
}

message QueueStats {
  int32 new = 1;
  int32 review = 2;
  int32 learning = 3;
}

message GetNextCardRequest {
  string user_id = 1; // UUID
  string session_id = 2; // UUID
}

message GetNextCardResponse {
  CardStudyDto card = 1;
}

message CardStudyDto {
  string id = 1; // UUID
  string type = 2; // SENTENCE_MINING
  CardStudyContent content = 3;
  // Derived from note fields SourceTitle + SourceUrl when present (no separate study persistence).
  SourceMeta source_meta = 4;
  CardMedia media = 5;
  SrsState srs_state = 6;
  map<int32, string> next_intervals = 7;
  int32 siblings_count = 8;
}

message CardStudyContent {
  NotePayload note = 1;
  TargetIndex target_index = 2;
}

message SrsState {
  SrsStatus state = 1;
  int32 current_interval = 2; // days
  int32 step = 3;
  google.protobuf.Timestamp due_utc = 4;
  int32 lapses = 5;
  double stability = 6;
  double difficulty = 7;
  int32 scheduled_days = 8;
  int32 elapsed_days = 9;
}

message AnswerValidationResult {
  bool is_correct = 1;
  bool is_fuzzy_match = 2;
  google.protobuf.StringValue matched_synonym = 3;
  double similarity_score = 4;
  google.protobuf.StringValue suggestion = 5;
}

message SubmitReviewRequest {
  string user_id = 1; // UUID
  string session_id = 2; // UUID
  string card_id = 3; // UUID
  int32 rating = 4; // 1=Again, 2=Hard, 3=Good, 4=Easy
  int32 duration_ms = 5;
  google.protobuf.StringValue user_answer = 6; // Опциональный текстовый ответ пользователя
}

message SubmitReviewResponse {
  string card_id = 1; // UUID
  google.protobuf.Timestamp next_review_date = 2;
  string interval = 3; // e.g., "3d", "2w"
  SrsStatus state = 4;
  double stability = 5;
  bool is_leech = 6;
  int32 buried_siblings_count = 7;
  AnswerValidationResult answer_validation = 8; // Результат проверки ответа (если user_answer был предоставлен)
}

message UndoReviewRequest {
  string user_id = 1; // UUID
  string session_id = 2; // UUID
}

message UndoReviewResponse {
  bool success = 1;
  string restored_card_id = 2; // UUID
  string message = 3;
}

// ============================================================================
// Analytics Service (SR-ANL-01, SR-ANL-02, SR-ANL-03)
// ============================================================================

service AnalyticsService {
  // --------------------------------------------------------------------------
  // Analytics (SR-ANL-01, SR-ANL-02, SR-ANL-03)
  // --------------------------------------------------------------------------

  // Оценка словарного запаса (SR-ANL-01)
  rpc GetVocabularyStats (GetVocabularyStatsRequest) returns (GetVocabularyStatsResponse);

  // Календарь активности (SR-ANL-02)
  rpc GetHeatmap (GetHeatmapRequest) returns (GetHeatmapResponse);

  // Дневная сводка и Streaks (SR-ANL-03)
  rpc GetDailySummary (GetDailySummaryRequest) returns (GetDailySummaryResponse);

  // Оценка навыков (Phase 2 - Deep Skill Tracking)
  rpc GetSkillBalance (GetSkillBalanceRequest) returns (GetSkillBalanceResponse);

  // Ежедневный автопилот (Phase 4)
  rpc GetDailyAutopilotPlan (GetDailyAutopilotPlanRequest) returns (GetDailyAutopilotPlanResponse);

  // Трекинг активности пользователя по скиллу (Phase 4)
  rpc TrackSkillActivity (TrackSkillActivityRequest) returns (TrackSkillActivityResponse);

  // История оценки навыков
  rpc GetSkillAssessmentHistory (GetSkillAssessmentHistoryRequest) returns (GetSkillAssessmentHistoryResponse);
}

// SR-ANL-01: Vocabulary Stats Messages
message GetVocabularyStatsRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
}

message CefrLevel {
  string code = 1; // A1, A2, B1, B2, C1, C2
  string title = 2; // "Beginner", "Elementary", etc.
  int32 progress_percent = 3; // 0-100
  int32 words_to_next_level = 4;
}

message GetVocabularyStatsResponse {
  string project_id = 1; // UUID
  int32 total_lemmas = 2;
  int32 mature_count = 3;
  int32 learning_count = 4;
  int32 new_count = 5;
  CefrLevel cefr_level = 6;
  int32 estimated_fluency = 7; // 0-100
  int32 saved_count = 8;
  int32 reviewing_count = 9;
}

// Phase 2: Skill Balance Messages
message GetSkillBalanceRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
}

message GetSkillBalanceResponse {
  string project_id = 1; // UUID
  int32 average_reading_level = 2; // 0-100
  int32 average_listening_level = 3; // 0-100
  int32 average_writing_level = 4; // 0-100
  int32 average_speaking_level = 5; // 0-100
}

// SR-ANL-02: Heatmap Messages
message GetHeatmapRequest {
  string user_id = 1; // UUID
  google.protobuf.StringValue project_id = 2; // UUID (Optional, null = all projects)
  int32 year = 3; // e.g., 2025
}

message ActivityDay {
  int32 count = 1; // Number of reviews
  int32 level = 2; // Intensity level 1-4
}

message GetHeatmapResponse {
  google.protobuf.StringValue project_id = 1; // UUID (null if all projects)
  int32 year = 2;
  int32 total_reviews = 3;
  int32 longest_streak = 4;
  map<string, ActivityDay> activity = 5; // Date string (YYYY-MM-DD) -> ActivityDay
  int32 total_time_spent_seconds = 6; // Сумма времени изучения за год (секунды)
}

// SR-ANL-03: Daily Summary Messages
message GetDailySummaryRequest {
  string user_id = 1; // UUID
  google.protobuf.Int32Value timezone_offset = 2; // Minutes offset from UTC (Optional)
}

message GoalProgress {
  int32 current = 1;
  int32 target = 2;
  bool is_completed = 3;
}

message GetDailySummaryResponse {
  string date = 1; // YYYY-MM-DD
  int32 current_streak = 2;
  bool is_streak_extended_today = 3;
  int32 time_spent_seconds = 4;
  GoalProgress new_cards = 5;
  GoalProgress reviews = 6;
}

// ============================================================================
// Community Service (SR-COL, SR-PUB, SR-MKT)
// ============================================================================

service CommunityService {
  // --------------------------------------------------------------------------
  // Contributions (SR-COL-01 до SR-COL-08)
  // --------------------------------------------------------------------------

  // Создание предложения (SR-COL-01)
  rpc CreateContribution (CreateContributionRequest) returns (CreateContributionResponse);

  // Получение списка предложений (SR-COL-03)
  rpc GetContributions (GetContributionsRequest) returns (GetContributionsResponse);

  // Получение предложения с Diff (SR-COL-03)
  rpc GetContribution (GetContributionRequest) returns (GetContributionResponse);

  // Принятие/Отклонение предложения (SR-COL-04)
  rpc ResolveContribution (ResolveContributionRequest) returns (ResolveContributionResponse);

  // Обновление политики вкладов (SR-COL-06)
  rpc UpdateContributionPolicy (UpdateContributionPolicyRequest) returns (UpdateContributionPolicyResponse);

  // --------------------------------------------------------------------------
  // Publishing (SR-PUB-01 до SR-PUB-04)
  // --------------------------------------------------------------------------

  // Публикация колоды (SR-PUB-01)
  rpc PublishDeck (PublishDeckRequest) returns (PublishDeckResponse);

  // Клонирование колоды (SR-PUB-02)
  rpc ForkDeck (ForkDeckRequest) returns (ForkDeckResponse);

  // Получение опубликованных колод (SR-PUB-01)
  rpc GetPublishedDecks (GetPublishedDecksRequest) returns (GetPublishedDecksResponse);

  // Получение профиля автора (SR-PUB-04)
  rpc GetAuthorProfile (GetAuthorProfileRequest) returns (GetAuthorProfileResponse);

  // --------------------------------------------------------------------------
  // Marketplace (SR-MKT-01 до SR-MKT-06)
  // --------------------------------------------------------------------------

  // Создание товара (SR-MKT-01)
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);

  // Обновление товара (SR-MKT-01)
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse);

  // Получение списка товаров (SR-MKT-01)
  rpc GetProducts (GetProductsRequest) returns (GetProductsResponse);

  // Получение деталей товара (SR-MKT-02)
  rpc GetProductDetails (GetProductDetailsRequest) returns (GetProductDetailsResponse);

  // Создание отзыва (SR-MKT-05)
  rpc CreateReview (CreateReviewRequest) returns (CreateReviewResponse);

  // Получение статистики товара (SR-MKT-06)
  rpc GetProductStats (GetProductStatsRequest) returns (GetProductStatsResponse);

  // Проверка прав доступа (SR-MKT-03, SR-COL-07)
  rpc CheckEntitlement (CheckEntitlementRequest) returns (CheckEntitlementResponse);
}

// ============================================================================
// Contributions Messages
// ============================================================================

message CreateContributionRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
  google.protobuf.StringValue card_id = 3; // UUID (Optional, required for EDIT/DELETE)
  string type = 4; // EDIT, ADD, DELETE
  CardContent content = 5; // Required for EDIT/ADD
  google.protobuf.StringValue comment = 6; // Optional
}

message CardContent {
  map<string, NoteFieldValuePayload> field_values = 1;
}

message CreateContributionResponse {
  string contribution_id = 1; // UUID
}

message GetContributionsRequest {
  string user_id = 1; // UUID
  google.protobuf.StringValue deck_id = 2; // UUID (Optional)
  google.protobuf.StringValue status = 3; // PENDING, MERGED, REJECTED (Optional)
  string role = 4; // AUTHOR (my contributions) or MODERATOR (deck owner)
}

message GetContributionsResponse {
  repeated ContributionDto contributions = 1;
}

message ContributionDto {
  string id = 1; // UUID
  string target_deck_id = 2; // UUID
  google.protobuf.StringValue target_card_id = 3; // UUID (Optional)
  AuthorInfo author = 4;
  string type = 5; // EDIT, ADD, DELETE
  string status = 6; // PENDING, MERGED, REJECTED
  CardContent content = 7; // Proposed content
  google.protobuf.StringValue comment = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message AuthorInfo {
  string user_id = 1; // UUID
  string display_name = 2; // Optional, from user service
}

message GetContributionRequest {
  string user_id = 1; // UUID
  string contribution_id = 2; // UUID
}

message GetContributionResponse {
  ContributionDto contribution = 1;
  ContributionDiff diff = 2;
}

message ContributionDiff {
  CardContent original_card = 1; // Null for ADD type
  CardContent proposed_card = 2;
  repeated string changed_fields = 3;
  bool is_conflict = 4; // True if card was modified after contribution creation
}

message ResolveContributionRequest {
  string user_id = 1; // UUID
  string contribution_id = 2; // UUID
  string status = 3; // MERGED or REJECTED
  google.protobuf.StringValue resolution_comment = 4; // Optional
}

message ResolveContributionResponse {
  bool success = 1;
  google.protobuf.StringValue merged_card_id = 2; // UUID (for ADD type)
}

message UpdateContributionPolicyRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
  string policy = 3; // OPEN, RESTRICTED, CLOSED
}

message UpdateContributionPolicyResponse {
  bool success = 1;
}

// ============================================================================
// Publishing Messages
// ============================================================================

message PublishDeckRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
  string license_type = 3; // FREE or COMMERCIAL
}

message PublishDeckResponse {
