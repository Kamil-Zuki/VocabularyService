syntax = "proto3";

package pvs.content.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "Pvs.Content.Grpc";

// ============================================================================
// Service Definition
// ============================================================================

service ContentService {
  // --------------------------------------------------------------------------
  // Projects (SR-STR-01, SR-STR-02)
  // --------------------------------------------------------------------------
  
  // Создание нового языкового проекта (SR-STR-01)
  rpc CreateProject (CreateProjectRequest) returns (ProjectResponse);

  // Получение списка проектов пользователя (SR-STR-01)
  rpc GetProjects (GetProjectsRequest) returns (GetProjectsResponse);

  // Получение деталей проекта и настроек SRS (SR-STR-02)
  rpc GetProjectDetails (GetProjectDetailsRequest) returns (ProjectResponse);

  // Обновление настроек проекта (SR-STR-02)
  rpc UpdateProject (UpdateProjectRequest) returns (ProjectResponse);

  // Удаление проекта и каскадное уничтожение его данных
  rpc DeleteProject (DeleteProjectRequest) returns (google.protobuf.Empty);

  // Получение статистики потраченных лимитов пользователя
  rpc GetUserUsageStats (GetUserUsageStatsRequest) returns (GetUserUsageStatsResponse);


  // --------------------------------------------------------------------------
  // User Settings (SR-SETT-01)
  // --------------------------------------------------------------------------

  // Получение глобальных настроек (SR-SETT-01)
  rpc GetUserSettings (GetUserSettingsRequest) returns (UserSettingsResponse);

  // Обновление глобальных настроек (SR-SETT-01)
  rpc UpdateUserSettings (UpdateUserSettingsRequest) returns (UserSettingsResponse);


  // --------------------------------------------------------------------------
  // Decks (SR-STR-03, SR-VOC-01, SR-BG-02)
  // --------------------------------------------------------------------------

  // Получение дерева колод (SR-STR-03)
  rpc GetDeckTree (GetDeckTreeRequest) returns (GetDeckTreeResponse);

  // Получение детальной информации о колоде (Id, Title, Description, Stats, ParentDeckId)
  rpc GetDeckDetail (GetDeckDetailRequest) returns (GetDeckDetailResponse);

  // Создание колоды (SR-VOC-01)
  rpc CreateDeck (CreateDeckRequest) returns (DeckResponse);

  // Обновление колоды (SR-VOC-01)
  rpc UpdateDeck (UpdateDeckRequest) returns (DeckResponse);

  // Удаление колоды (SR-BG-02)
  rpc DeleteDeck (DeleteDeckRequest) returns (google.protobuf.Empty);
}

service CardService {
  // Создание карточки вручную (SR-VOC-01)
  rpc CreateCard (CreateCardRequest) returns (CardResponse);

  // Проверка наличия карточек с той же леммой в проекте (SR-VOC-05)
  rpc CheckCardDuplicates (CheckCardDuplicatesRequest) returns (CheckCardDuplicatesResponse);

  // Захват карточки из расширения (SR-API-01)
  rpc CaptureCard (CaptureCardRequest) returns (CardResponse);

  // Получение карточки по ID
  rpc GetCard (GetCardRequest) returns (CardResponse);

  // Обновление карточки (SR-VOC-02)
  rpc UpdateCard (UpdateCardRequest) returns (CardResponse);

  // Удаление карточки
  rpc DeleteCard (DeleteCardRequest) returns (google.protobuf.Empty);

  // Полнотекстовый поиск (SR-SRC-01)
  rpc SearchCards (SearchCardsRequest) returns (SearchCardsResponse);

  // Список карточек в колоде
  rpc GetCardsByDeck (GetCardsByDeckRequest) returns (GetCardsByDeckResponse);

  // Массовое создание карточек (Импорт SR-VOC-03)
  rpc BulkCreateCards (BulkCreateCardsRequest) returns (BulkCreateCardsResponse);

  // Старт фоновой задачи импорта из файла (.apkg, .csv, .tsv)
  rpc StartImportJob (StartImportJobRequest) returns (StartImportJobResponse);

  // Получение статуса фоновой задачи импорта
  rpc GetImportJobStatus (GetImportJobStatusRequest) returns (GetImportJobStatusResponse);


  // Приостановка обучения карточки (SR-VOC-04)
  rpc SuspendCard (SuspendCardRequest) returns (google.protobuf.Empty);

  // Возобновление обучения карточки (SR-VOC-04)
  rpc UnsuspendCard (UnsuspendCardRequest) returns (google.protobuf.Empty);

  // Получение облегченных превью карточек (SR-MKT-02)
  rpc GetCardPreviews (GetCardPreviewsRequest) returns (GetCardPreviewsResponse);

  // Массовое удаление карточек
  rpc BulkDeleteCards (BulkDeleteCardsRequest) returns (google.protobuf.Empty);

  // Перемещение карточек между колодами
  rpc MoveCards (MoveCardsRequest) returns (google.protobuf.Empty);

  // Сброс прогресса карточек (FSRS)
  rpc ResetCardProgress (ResetCardProgressRequest) returns (google.protobuf.Empty);

  // Список сложных (leech) карточек
  rpc GetLeechCards (GetLeechCardsRequest) returns (GetLeechCardsResponse);

  // Список карточек без медиа
  rpc GetCardsMissingMedia (GetCardsMissingMediaRequest) returns (GetCardsMissingMediaResponse);

  // Загрузка изображения в хранилище (для редактора карточек: буфер / файл)
  rpc UploadImage (UploadImageRequest) returns (UploadImageResponse);

  // Загрузка PDF-документа в хранилище (для Reader)
  rpc UploadDocument (UploadDocumentRequest) returns (UploadDocumentResponse);

  // Получение URL изображения по ID (для отдачи через Aggregator)
  rpc GetImageUrl (GetImageUrlRequest) returns (GetImageUrlResponse);

  // Редактор: тип заметки Anki-like + шаблоны для динамических полей
  rpc GetNoteTypeForEditor (GetNoteTypeForEditorRequest) returns (GetNoteTypeForEditorResponse);
}

service TermService {
  rpc CreateOrUpdateTerm (CreateOrUpdateTermRequest) returns (TermDetailsResponse);
  rpc MarkTermKnown (TermActionRequest) returns (TermDetailsResponse);
  rpc IgnoreTerm (TermActionRequest) returns (TermDetailsResponse);
  rpc BulkMarkKnown (BulkMarkKnownRequest) returns (BulkMarkKnownResponse);
  rpc GetTermDetails (GetTermDetailsRequest) returns (TermDetailsResponse);
  rpc SearchTermDuplicates (SearchTermDuplicatesRequest) returns (SearchTermDuplicatesResponse);
  // Список терминов проекта для пользователя (cursor по UpdatedAt DESC, TermId ASC)
  rpc ListProjectTerms (ListProjectTermsRequest) returns (ListProjectTermsResponse);
  // Удаление демо-карточек импорта (Automation IMPORT job)
  rpc PurgeDemoImport (PurgeDemoImportRequest) returns (PurgeDemoImportResponse);
}

service StudyService {
  // --------------------------------------------------------------------------
  // Study Session Management (SR-LRN-01, SR-LRN-02, SR-LRN-03, SR-LRN-08)
  // --------------------------------------------------------------------------

  // Старт новой сессии обучения (SR-LRN-01)
  rpc StartStudySession (StartStudySessionRequest) returns (StartStudySessionResponse);

  // Получение следующей карточки (SR-LRN-02)
  rpc GetNextCard (GetNextCardRequest) returns (GetNextCardResponse);

  // Отправка оценки (FSRS) (SR-LRN-03)
  rpc SubmitReview (SubmitReviewRequest) returns (SubmitReviewResponse);

  // Отмена последнего действия (SR-LRN-08)
  rpc UndoReview (UndoReviewRequest) returns (UndoReviewResponse);
}

// ============================================================================
// Service Definition
// ============================================================================

service LessonService {
  rpc GetLessons (GetLessonsRequest) returns (GetLessonsResponse);
  rpc GetLesson (GetLessonRequest) returns (GetLessonResponse);
  rpc StartLesson (StartLessonRequest) returns (StartLessonResponse);
  rpc CompleteLesson (CompleteLessonRequest) returns (google.protobuf.Empty);
  rpc SetPlacementLevel (SetPlacementLevelRequest) returns (google.protobuf.Empty);
  rpc SubmitKnowledgeCheckResult (SubmitKnowledgeCheckResultRequest) returns (google.protobuf.Empty);
}

// ============================================================================
// Enums & Shared Types
// ============================================================================

enum SrsStatus {
  SRS_STATUS_NEW = 0;
  SRS_STATUS_LEARNING = 1;
  SRS_STATUS_REVIEW = 2;
  // Устарело: в FSRS/py-fsrs состояние 3 — Relearning, не «mature». Используйте SRS_STATUS_RELEARNING.
  SRS_STATUS_MATURE = 3;
  // Как в Anki / py-fsrs State.Relearning (после Again из Review).
  SRS_STATUS_RELEARNING = 4;
}

message TargetIndex {
  int32 start = 1;
  int32 len = 2;
}

message CardMedia {
  google.protobuf.StringValue image_id = 1;
  google.protobuf.StringValue audio_id = 2;
  string image_url = 3;  // URL for browser/display (filled after FillCardMediaUrlsAsync)
  string audio_url = 4;
}

message SourceMeta {
  string type = 1;
  string title = 2;
  google.protobuf.StringValue url = 3;
  google.protobuf.Int32Value page = 4;
  google.protobuf.Int32Value timestamp = 5;
  google.protobuf.StringValue service = 6;
}

message NoteFieldValuePayload {
  google.protobuf.StringValue string_value = 1;
  repeated string string_values = 2;
}

message NoteFieldDefinitionPayload {
  string field_key = 1;
  string label = 2;
  string field_type = 3;
  int32 sort_order = 4;
  bool required = 5;
  bool archived = 6;
}

message CardTemplatePayload {
  string id = 1;
  string template_key = 2;
  string name = 3;
  string front_template = 4;
  string back_template = 5;
  int32 sort_order = 6;
  bool enabled = 7;
}

message NoteTypePayload {
  string id = 1;
  string project_id = 2;
  string name = 3;
  int32 version = 4;
  repeated NoteFieldDefinitionPayload fields = 5;
  repeated CardTemplatePayload templates = 6;
}

message NotePayload {
  string id = 1;
  string note_type_id = 2;
  map<string, NoteFieldValuePayload> field_values = 3;
  google.protobuf.StringValue project_term_id = 4;
}

message GetNoteTypeForEditorRequest {
  string user_id = 1;
  string project_id = 2;
}

message GetNoteTypeForEditorResponse {
  NoteTypePayload note_type = 1;
  CardTemplatePayload default_template = 2;
}

enum ContributionPolicy {
  CONTRIBUTION_POLICY_OPEN = 0;
  CONTRIBUTION_POLICY_RESTRICTED = 1;
  CONTRIBUTION_POLICY_CLOSED = 2;
}

enum LicenseType {
  LICENSE_TYPE_PRIVATE = 0;
  LICENSE_TYPE_FREE_ATTRIBUTION = 1;
  LICENSE_TYPE_COMMERCIAL = 2;
  LICENSE_TYPE_COMMERCIAL_DERIVATIVE = 3;
}

message SrsSettings {
  double request_retention = 1;
  int32 maximum_interval = 2;
  repeated double w = 3; // Веса FSRS
  bool enable_short_term = 4;
  // Как в Anki: длительности шагов learning/relearning (секунды) и fuzz для интервалов
  repeated int32 learning_steps_seconds = 5;   // напр. 60, 600 — 1 мин, 10 мин
  repeated int32 relearning_steps_seconds = 6; // напр. 600 — 10 мин
  bool enable_fuzzing = 7;                     // по умолчанию true в клиентах / БД
}

message TtsSettings {
  string voice_name = 1;   // Browser voice name, e.g. "Google US English"
  double rate = 2;          // Speech rate 0.1–10.0 (default 1.0)
  double pitch = 3;         // Speech pitch 0.0–2.0 (default 1.0)
}

message ProjectStats {
  int32 total_lemmas = 1;
  int32 mature_lemmas = 2;
}

// ============================================================================
// Project Messages
// ============================================================================

message ProjectResponse {
  string id = 1; // UUID
  string user_id = 2; // UUID
  string title = 3;
  string source_lang = 4;
  string target_lang = 5;
  SrsSettings settings = 6;
  ProjectStats stats = 7;
  bool is_archived = 8;
  google.protobuf.Timestamp created_at = 9;
  TtsSettings tts_settings = 10;
}

message CreateProjectRequest {
  string user_id = 1; // UUID
  string title = 2;
  string source_lang = 3;
  string target_lang = 4;
  SrsSettings settings = 5; // Optional
  TtsSettings tts_settings = 6; // Optional
}

message GetProjectsRequest {
  string user_id = 1; // UUID
  bool include_archived = 2;
}

message GetProjectsResponse {
  repeated ProjectResponse projects = 1;
}

message GetProjectDetailsRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
}

message UpdateProjectRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
  
  // Wrappers используются для возможности передать null (не обновлять поле)
  google.protobuf.StringValue title = 3;
  google.protobuf.BoolValue is_archived = 4;
  SrsSettings settings = 5; 
  TtsSettings tts_settings = 6;
}

message DeleteProjectRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
}

message GetUserUsageStatsRequest {
  string user_id = 1; // UUID
}

message GetUserUsageStatsResponse {
  int32 projects_used = 1;
  int32 cards_used = 2;
  int32 ai_requests_today_used = 3;
  int32 books_used = 4;
}

// ============================================================================
// User Settings Messages
// ============================================================================

message UserSettingsResponse {
  string user_id = 1; // UUID
  int32 rollover_hour = 2;
  int32 daily_goal_new = 3;
  int32 daily_goal_review = 4;
  string interface_language = 5;
  int32 current_streak = 6;
  int32 max_streak = 7;
}

message GetUserSettingsRequest {
  string user_id = 1; // UUID
}

message UpdateUserSettingsRequest {
  string user_id = 1; // UUID
  
  google.protobuf.Int32Value rollover_hour = 2;
  google.protobuf.Int32Value daily_goal_new = 3;
  google.protobuf.Int32Value daily_goal_review = 4;
  google.protobuf.StringValue interface_language = 5;
}

// ============================================================================
// Deck Messages
// ============================================================================

message DeckResponse {
  string id = 1; // UUID
  string project_id = 2; // UUID
  google.protobuf.StringValue parent_deck_id = 3; // UUID, nullable
  string owner_id = 4; // UUID
  string title = 5;
  google.protobuf.StringValue description = 6; // nullable
  google.protobuf.StringValue cover_image_url = 7; // nullable
  bool is_public = 8;
  ContributionPolicy contribution_policy = 9;
  LicenseType license_type = 10;
  google.protobuf.StringValue forked_from_id = 11; // UUID, nullable
  int32 card_count = 12;
  google.protobuf.Timestamp created_at = 13;
}

message DeckTreeItem {
  string id = 1; // UUID
  string title = 2;
  int32 card_count = 3;
  repeated DeckTreeItem children = 4; // Рекурсивная вложенность
  string owner_id = 5; // UUID, для фильтра «Мои»
  bool is_public = 6; // для фильтра «Публичные»
  string forked_from_id = 7; // UUID, пусто если не скачано/не куплено; для фильтра «Скачанные» и бейджа Purchased
  string cover_image_url = 8; // URL обложки
  DeckDetailStats stats = 9; // Статистика карточек для текущего пользователя
}

// Фильтр библиотеки: Мои / Скачанные / Публичные
enum LibraryFilter {
  LIBRARY_FILTER_UNSPECIFIED = 0;
  MINE = 1;       // OwnerId == userId
  DOWNLOADED = 2; // ForkedFromId != null
  PUBLIC = 3;    // IsPublic == true
}

message GetDeckTreeRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
  LibraryFilter library_filter = 3; // опционально: фильтр для Library
}

message GetDeckTreeResponse {
  repeated DeckTreeItem root_decks = 1;
}

message GetDeckDetailRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
}

message DeckDetailStats {
  int32 new_cards_count = 1;
  int32 learning_cards_count = 2;
  int32 due_cards_count = 3;
  int32 total_cards_count = 4;
  int32 studyable_now_count = 5;
}

message GetDeckDetailResponse {
  string id = 1; // UUID
  string title = 2;
  google.protobuf.StringValue description = 3;
  google.protobuf.StringValue parent_deck_id = 4; // UUID, nullable
  DeckDetailStats stats = 5;
  string project_id = 6; // UUID
  string owner_id = 7; // UUID
  string cover_image_url = 8;
  bool is_public = 9;
  string contribution_policy = 10; // OPEN, RESTRICTED, CLOSED
  string license_type = 11; // PRIVATE, FREE_ATTRIBUTION, etc.
  string forked_from_id = 12; // UUID, empty if not forked
  google.protobuf.Timestamp created_at = 13;
  int32 card_count = 14;
}

message CreateDeckRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
  google.protobuf.StringValue parent_deck_id = 3; // UUID (Optional)
  string title = 4;
  google.protobuf.StringValue description = 5;
  bool is_public = 6;
  google.protobuf.StringValue cover_image_url = 7; // Optional
}

message UpdateDeckRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
  
  google.protobuf.StringValue title = 3;
  google.protobuf.StringValue description = 4;
  google.protobuf.StringValue parent_deck_id = 5; // UUID
  google.protobuf.StringValue cover_image_url = 6;
  google.protobuf.BoolValue is_public = 7;
  
  // Для enum в proto3 нет стандартного Wrapper, 
  // используем oneof или специальное значение (например -1) для "не менять",
  // либо кастомный Wrapper. Здесь для простоты используем поле + маску или считаем, 
  // что 0 - это дефолт, но это опасно для Enum.
  // Лучшая практика gRPC для опциональных enum - использовать oneof.
  
  oneof policy_update {
      ContributionPolicy contribution_policy = 8;
  }

  oneof license_update {
      LicenseType license_type = 9;
  }
}

message DeleteDeckRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
}

// ============================================================================
// Card Messages
// ============================================================================

message CardResponse {
  string id = 1; // UUID
  string deck_id = 2; // UUID
  string creator_id = 3; // UUID
  SrsStatus srs_status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.StringValue project_term_id = 6;
  NotePayload note = 7;
  CardTemplatePayload active_card_template = 8;
  SrsState srs_state = 9;
}

message CreateCardRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
  map<string, NoteFieldValuePayload> field_values = 3;
}

message CheckCardDuplicatesRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
  string term_text = 3;
}

message CheckCardDuplicatesResponse {
  bool is_duplicate = 1;
  repeated CardPreview existing_cards = 2;
  google.protobuf.StringValue normalized_surface = 3;
}

message CaptureCardRequest {
  string user_id = 1; // UUID
  string project_id = 2; // UUID
  map<string, NoteFieldValuePayload> field_values = 3;
  google.protobuf.StringValue screenshot_base64 = 4;
  // When unset or empty, capture uses the project "Inbox" deck (same as legacy behavior).
  google.protobuf.StringValue deck_id = 5; // UUID
}

message GetCardRequest {
  string user_id = 1; // UUID
  string card_id = 2; // UUID
}

message UpdateCardRequest {
  string user_id = 1; // UUID
  string card_id = 2; // UUID
  map<string, NoteFieldValuePayload> field_values = 3;
}

message DeleteCardRequest {
  string user_id = 1; // UUID
  string card_id = 2; // UUID
}

message SearchCardsRequest {
  string user_id = 1; // UUID
  string query = 2;
  google.protobuf.StringValue project_id = 3; // UUID
  google.protobuf.StringValue deck_id = 4; // UUID
  int32 page_number = 5;
  int32 page_size = 6;
  repeated SrsStatus srs_statuses = 7; // Фильтрация по статусу
}

message SearchCardsResponse {
  repeated CardResponse items = 1;
  int32 page_number = 2;
  int32 total_pages = 3;
  int32 total_count = 4;
}

message GetCardsByDeckRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
  int32 page_number = 3;
  int32 page_size = 4;
}

message GetCardsByDeckResponse {
  repeated CardResponse items = 1;
  int32 page_number = 2;
  int32 total_pages = 3;
  int32 total_count = 4;
}

message BulkCreateCardsRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
  repeated CreateCardRequest cards = 3;
}

message BulkCreateCardsResponse {
  repeated CardResponse created_cards = 1;
}

message StartImportJobRequest {
  string user_id = 1; // UUID
  string deck_id = 2; // UUID
  string document_id = 3; // UUID из MediaService
  string file_name = 4;
  string config_json = 5;
}

message StartImportJobResponse {
  string job_id = 1; // UUID фоновой задачи
}

message GetImportJobStatusRequest {
  string user_id = 1; // UUID
  string job_id = 2; // UUID
}

message GetImportJobStatusResponse {
  string job_id = 1;
  string status = 2; // QUEUED, RUNNING, COMPLETED, FAILED
  int32 total_rows = 3;
  int32 processed_rows = 4;
  google.protobuf.StringValue error_message = 5;
}


message CreateOrUpdateTermRequest {
  string user_id = 1;
  string project_id = 2;
  string term_text = 3;
  string type = 4;
  string language = 5;
  string status = 6; // NEW, SAVED (сохранённый термин; legacy LINGQ/LEARNING принимаются на бэкенде), KNOWN, IGNORED
  google.protobuf.StringValue meaning = 7;
  google.protobuf.StringValue first_sentence = 8;
  google.protobuf.StringValue first_source_title = 9;
  google.protobuf.StringValue first_source_url = 10;
}

message TermActionRequest {
  string user_id = 1;
  string project_id = 2;
  string term_text = 3;
  string type = 4;
  string language = 5;
}

message BulkMarkKnownItem {
  string term_text = 1;
  string type = 2; // WORD or PHRASE
}

message BulkMarkKnownRequest {
  string user_id = 1;
  string project_id = 2;
  repeated string term_texts = 3; // legacy: treated as WORD
  string language = 4;
  repeated BulkMarkKnownItem items = 5;
}

message BulkMarkKnownResponse {
  int32 updated_count = 1;
}

message GetTermDetailsRequest {
  string user_id = 1;
  string project_id = 2;
  string term_text = 3;
  string type = 4;
}

message SearchTermDuplicatesRequest {
  string user_id = 1;
  string project_id = 2;
  string term_text = 3;
  string type = 4;
}

message TermDetailsResponse {
  string term_id = 1;
  string project_id = 2;
  string term_text = 3;
  string normalized_text = 4;
  string type = 5;
  string language = 6;
  string status = 7;
  google.protobuf.StringValue meaning = 8;
  google.protobuf.StringValue first_sentence = 9;
  google.protobuf.StringValue first_source_title = 10;
  google.protobuf.StringValue first_source_url = 11;
  repeated CardPreview related_cards = 12;
  int32 reading_level = 13;
  int32 listening_level = 14;
  int32 writing_level = 15;
  int32 speaking_level = 16;
}

message SearchTermDuplicatesResponse {
  bool is_duplicate = 1;
  string normalized_text = 2;
  repeated TermDetailsResponse matching_terms = 3;
  repeated CardPreview existing_cards = 4;
}

message ListProjectTermsRequest {
  string user_id = 1;
  string project_id = 2;
  // Пустая строка = без фильтра. SAVED включает legacy LINGQ/LEARNING в БД.
  string status = 3;
  string type = 4; // WORD | PHRASE, пусто = все
  string q = 5; // подстрока по Text / NormalizedText (без регистра где поддерживается)
  int32 page_number = 6; // начиная с 1
  int32 page_size = 7; // 0 → 50; макс. 100 на сервере
}

message ProjectTermListItem {
  string term_id = 1;
  string text = 2;
  string normalized_text = 3;
  string type = 4;
  string language = 5;
  string status = 6; // NEW, SAVED, KNOWN, IGNORED (LINGQ/LEARNING → SAVED)
  google.protobuf.StringValue meaning = 7;
  google.protobuf.StringValue first_sentence = 8;
  google.protobuf.StringValue first_source_title = 9;
  google.protobuf.StringValue first_source_url = 10;
  google.protobuf.Timestamp updated_at = 11;
  int32 related_card_count = 12;
  int32 reading_level = 13;
  int32 listening_level = 14;
  int32 writing_level = 15;
  int32 speaking_level = 16;
}

message ListProjectTermsResponse {
  repeated ProjectTermListItem items = 1;
  int32 total_count = 2;
}

message PurgeDemoImportRequest {
